[package]
name = "riot-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest.workspace = true
base64.workspace = true

[[example]]
name = "stream"

[workspace]
members = [".", "cli", "apigen"]

[workspace.dependencies]
reqwest = { version = "0", features=["json"] }
serde = "1"
serde_json = "1"
base64 = "0"
tokio = { version = "1", features = ["full"] }
