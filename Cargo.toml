[package]
name = "dawncore"
version = "0.1.0"
edition = "2024"

[dependencies]
dawncore-spec.workspace = true
dawncore-apigen.workspace = true
dawncore-cli.workspace = true
dawncore-generated.workspace = true
dawncore-util.workspace = true

[workspace]
members = [".", "cli", "apigen", "generated", "spec", "util"]

[workspace.dependencies]
dawncore = { path = "./" }
dawncore-spec = { path = "./spec/" }
dawncore-apigen = { path = "./apigen/" }
dawncore-cli = { path = "./cli/" }
dawncore-generated = { path = "./generated/" }
dawncore-util = { path = "./util/" }
reqwest = { version = "0", features=["json"] }
serde = "1"
serde_json = "1"
toml = "0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
regex = "1"
itertools = "0"
chrono = "0"
