[package]
name = "lapi"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest.workspace = true
base64.workspace = true
serde.workspace = true

[[example]]
name = "stream"

[workspace]
members = [".", "cli", "apigen"]

[workspace.dependencies]
lapi = { path = "./" }
lapi-apigen = { path = "./apigen/" }
lapi-cli = { path = "./cli/" }
reqwest = { version = "0", features=["json"] }
serde = "1"
serde_json = "1"
toml = "0"
base64 = "0"
tokio = { version = "1", features = ["full"] }
pingora = { version = "0.6", features = ["proxy"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
sysinfo = "0"
regex = "1"
